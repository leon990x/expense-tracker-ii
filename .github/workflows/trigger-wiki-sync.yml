name: Trigger Copilot Wiki Sync
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "**/*.docs.md"   # Only trigger when .docs.md extension files are touched
      - "docs_old/**"

jobs:
  ping-copilot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Summon Copilot to update wiki in this PR
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "@copilot please run the 'wiki-sync' skill on this branch. Analyze all \`*.docs.md\` and \`docs_old/**\` files, generate organized wiki pages into \`wiki/\`, and commit the result back to this PR branch so the wiki update is included when this PR is merged."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
