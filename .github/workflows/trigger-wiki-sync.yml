name: Trigger Copilot Wiki Sync
on:
  pull_request:
    types: [opened, synchronize]
    paths: [ '**.docs.md' ] # Only pings if docs are touched

jobs:
  ping-copilot:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Summon Copilot to current PR
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "@copilot please run the 'wiki-sync' skill on this branch."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}