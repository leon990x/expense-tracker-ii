name: Wiki Sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '.github/workflows/wiki-sync.yml'
  pull_request:
    types: [opened, synchronize, closed]
    paths-ignore: ['wiki/**']

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  sync-wiki:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify git repository
        run: |
          pwd
          git rev-parse --is-inside-work-tree

      - name: Clone GitHub Wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.wiki.git" \
            /tmp/wiki-repo

      - name: Copy wiki/ pages and regenerate _Sidebar.md
        working-directory: ${{ github.workspace }}
        run: |
          if compgen -G 'wiki/*.md' > /dev/null; then
            cp wiki/*.md /tmp/wiki-repo/
          fi
          printf '## Wiki\n\n' > /tmp/wiki-repo/_Sidebar.md
          shopt -s nullglob
          for f in /tmp/wiki-repo/*.md; do
            [[ "$(basename "$f")" == "_Sidebar.md" ]] && continue
            title=$(basename "${f%.md}")
            printf -- '- [%s](%s)\n' "$title" "$title" >> /tmp/wiki-repo/_Sidebar.md
          done

      - name: Commit and push to wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /tmp/wiki-repo
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: sync wiki from main [skip ci]"
            git push \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.wiki.git" \
              HEAD:master
          fi

  ping-copilot:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Ping Copilot on PR opened
        if: github.event.action == 'opened'
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body "@copilot please run the 'wiki-sync' skill on this branch immediately. Follow section '### 3. Generate Wiki Files In wiki/' from .github/skills/wiki-sync/SKILL.md. Analyze BUSINESS-RULES.md, TECHNICAL-NOTES.md, and *.doc.md files anywhere in this repo, generate/update the wiki pages in the /wiki folder (Home.md and related pages), and commit those /wiki file updates directly to this PR branch. Do not push to the repository wiki in this step."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ping Copilot on PR synchronize
        if: github.event.action == 'synchronize'
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body "@copilot please rerun the 'wiki-sync' skill immediately for this updated PR branch. Follow section '### 3. Generate Wiki Files In wiki/' from .github/skills/wiki-sync/SKILL.md and refresh all generated pages under /wiki based on BUSINESS-RULES.md, TECHNICAL-NOTES.md, and *.doc.md files. Commit the refreshed /wiki changes to this PR branch only. Do not publish to the repository wiki in this step."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger wiki-sync after PR merge
        if: github.event.action == 'closed' && github.event.pull_request.merged == true
        run: |
          gh workflow run wiki-sync.yml --repo ${{ github.repository }} --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
