name: "Copilot Targeted Doc Sync"
on:
 pull_request:
   types: [opened, synchronize]
jobs:
 agent-update:
   runs-on: ubuntu-latest
   permissions:
     contents: write
     pull-requests: write
   steps:
     - name: Checkout
       uses: actions/checkout@v4
       with:
         fetch-depth: 0
     - name: Targeted Agent Execution
       env:
         GH_TOKEN: ${{ github.token }}
       run: |
         gh extension install github/gh-copilot
         # We instruct the agent to focus strictly on your three extensions
         gh copilot /delegate \
           --workspace \
           "Find all files ending in .doc.md, .business-rule.md, or .technical-notes.md.
            For each file changed or affected by code changes in this PR:
              1. Analyze what changed and why — do not copy the file verbatim.
              2. Synthesize the relevant changes into a structured wiki page under /wiki/.
              3. For .business-rule.md files: produce a clear, numbered list of business rules grouped by topic. Remove redundancy. Preserve intent.
              4. For .technical-notes.md files: produce a structured technical reference with sections for Overview, Implementation Details, Data Flow, and Extension Guide.
              5. For .doc.md files: produce a concise, readable summary covering purpose, key behaviors, and notable implementation decisions.
              6. Name each wiki page after its source component folder (e.g. AppNavDocs/BUSINESS-RULES.md → AppNavDocs-Business-Rules.md).
              7. Update /wiki/Home.md with links to any newly created or updated wiki pages.
            Commit all modified files under /wiki/."
     - name: Final Wiki Mirror
       if: success()
       run: |
         WIKI_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git"
         # This pushes your curated /wiki folder to the official GitHub Wiki tab
         mkdir temp_sync
         cp -r wiki/* temp_sync/
         cd temp_sync
         git init
         git config user.name "github-actions[bot]"
         git config user.email "github-actions[bot]@users.noreply.github.com"
         git add .
         git commit -m "Targeted Wiki Sync (PR #${{ github.event.pull_request.number }})" || echo "No changes"
         git push --force $WIKI_URL master