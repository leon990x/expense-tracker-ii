name: Wiki Sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '.github/workflows/wiki-sync.yml'
  pull_request:
    types: [opened, synchronize, closed]
    paths-ignore: ['wiki/**']
  pull_request_review:
    types: [submitted]

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  sync-wiki:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify git repository
        run: |
          pwd
          git rev-parse --is-inside-work-tree

      - name: Clone GitHub Wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.wiki.git" \
            /tmp/wiki-repo

      - name: Copy wiki/ pages and regenerate _Sidebar.md
        working-directory: ${{ github.workspace }}
        run: |
          if compgen -G 'wiki/*.md' > /dev/null; then
            cp wiki/*.md /tmp/wiki-repo/
          fi
          printf '## Wiki\n\n' > /tmp/wiki-repo/_Sidebar.md
          shopt -s nullglob
          for f in /tmp/wiki-repo/*.md; do
            [[ "$(basename "$f")" == "_Sidebar.md" ]] && continue
            title=$(basename "${f%.md}")
            printf -- '- [%s](%s)\n' "$title" "$title" >> /tmp/wiki-repo/_Sidebar.md
          done

      - name: Commit and push to wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /tmp/wiki-repo
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: sync wiki from main [skip ci]"
            git push \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.wiki.git" \
              HEAD:master
          fi

  ping-copilot:
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
    runs-on: ubuntu-latest
    steps:
      - name: Assign Copilot as reviewer on PR opened
        if: github.event_name == 'pull_request' && github.event.action == 'opened'
        run: |
          gh api \
            --method POST \
            /repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/requested_reviewers \
            --field 'reviewers[]=copilot-pull-request-reviewer'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post wiki-sync instructions after Copilot initial review
        if: github.event_name == 'pull_request_review' && github.event.review.user.login == 'copilot-pull-request-reviewer'
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body "**Invoke skill: wiki-sync**

          ⛔ DO NOT post any review comments until after you have committed \`wiki/\` changes to this branch.

          Your sole task right now is to run the wiki-sync skill. Read \`.github/skills/wiki-sync/SKILL.md\` and execute every step in this exact order — do not skip ahead:

          1. Detect source docs changed in this PR vs the base branch (patterns: \`BUSINESS-RULES.md\`, \`TECHNICAL-NOTES.md\`, \`*.doc.md\`; exclude \`wiki/\`).
          2. Read and analyze each changed source doc.
          3. Generate the corresponding \`wiki/\` page using the templates in SKILL.md §3c. Do NOT copy file contents verbatim.
          4. Regenerate \`wiki/Business-Rules.md\` and \`wiki/Technical-Notes.md\` aggregate indexes.
          5. Stage only \`wiki/\` files, commit with message \`docs: sync wiki pages [wiki-sync]\`, and push to this branch.
          6. Only after the push is confirmed may you add optional review commentary."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Re-assign Copilot after initial review
        if: github.event_name == 'pull_request_review' && github.event.review.user.login == 'copilot-pull-request-reviewer'
        run: |
          gh api \
            --method POST \
            /repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/requested_reviewers \
            --field 'reviewers[]=copilot-pull-request-reviewer'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post wiki-sync instructions on PR synchronize
        if: github.event_name == 'pull_request' && github.event.action == 'synchronize'
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body "**Invoke skill: wiki-sync** (PR updated)

          ⛔ DO NOT post any review comments until after you have committed \`wiki/\` changes to this branch.

          This PR has new commits. Re-run the wiki-sync skill for the latest changes. Read \`.github/skills/wiki-sync/SKILL.md\` and execute every step in this exact order — do not skip ahead:

          1. Detect source docs changed in this PR vs the base branch (patterns: \`BUSINESS-RULES.md\`, \`TECHNICAL-NOTES.md\`, \`*.doc.md\`; exclude \`wiki/\`).
          2. Read and analyze each changed source doc.
          3. Generate or update the corresponding \`wiki/\` page using the templates in SKILL.md §3c. Do NOT copy file contents verbatim.
          4. Regenerate \`wiki/Business-Rules.md\` and \`wiki/Technical-Notes.md\` aggregate indexes.
          5. Stage only \`wiki/\` files, commit with message \`docs: sync wiki pages [wiki-sync]\`, and push to this branch.
          6. Only after the push is confirmed may you add optional review commentary."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Re-assign Copilot as reviewer on PR synchronize
        if: github.event_name == 'pull_request' && github.event.action == 'synchronize'
        run: |
          gh api \
            --method POST \
            /repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/requested_reviewers \
            --field 'reviewers[]=copilot-pull-request-reviewer'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger wiki-sync after PR merge
        if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
        run: |
          gh workflow run wiki-sync.yml --repo ${{ github.repository }} --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
