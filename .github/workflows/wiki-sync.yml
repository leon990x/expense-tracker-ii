name: Wiki Sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '.github/workflows/wiki-sync.yml'
  pull_request:
    types: [opened, synchronize, closed]
    paths-ignore: ['wiki/**']

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  sync-wiki:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify git repository
        run: |
          pwd
          git rev-parse --is-inside-work-tree

      - name: Clone GitHub Wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.wiki.git" \
            /tmp/wiki-repo

      - name: Copy wiki/ pages and regenerate _Sidebar.md
        working-directory: ${{ github.workspace }}
        run: |
          if compgen -G 'wiki/*.md' > /dev/null; then
            cp wiki/*.md /tmp/wiki-repo/
          fi
          printf '## Wiki\n\n' > /tmp/wiki-repo/_Sidebar.md
          shopt -s nullglob
          for f in /tmp/wiki-repo/*.md; do
            [[ "$(basename "$f")" == "_Sidebar.md" ]] && continue
            title=$(basename "${f%.md}")
            printf -- '- [%s](%s)\n' "$title" "$title" >> /tmp/wiki-repo/_Sidebar.md
          done

      - name: Commit and push to wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /tmp/wiki-repo
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: sync wiki from main [skip ci]"
            git push \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.wiki.git" \
              HEAD:master
          fi

  ping-copilot:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Ping Copilot on PR opened
        if: github.event.action == 'opened'
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body "@copilot run the 'wiki-sync' skill on this branch with strict ordering. FIRST: follow section '### 3. Copy Source Docs to wiki/ with Prefixed Names' in .github/skills/wiki-sync/SKILL.md, generate/update /wiki pages from BUSINESS-RULES.md, TECHNICAL-NOTES.md, and *.doc.md files, and commit only /wiki changes to this PR branch. SECOND: only after that commit is complete, continue with any review commentary. Do not post review comments before wiki sync is done. Do not publish to the repository wiki in this step."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ping Copilot on PR synchronize
        if: github.event.action == 'synchronize'
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body "@copilot rerun the 'wiki-sync' skill immediately for this updated PR branch with strict ordering. FIRST: refresh generated pages under /wiki from BUSINESS-RULES.md, TECHNICAL-NOTES.md, and *.doc.md sources, and commit only /wiki changes to this PR branch. SECOND: only after wiki commit completes, continue with review commentary. Do not post review comments before wiki sync is done. Do not publish to the repository wiki in this step."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger wiki-sync after PR merge
        if: github.event.action == 'closed' && github.event.pull_request.merged == true
        run: |
          gh workflow run wiki-sync.yml --repo ${{ github.repository }} --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
