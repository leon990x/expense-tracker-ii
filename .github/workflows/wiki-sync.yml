name: Sync Wiki

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'wiki/**'
      - '**/*.docs.md'
      - 'docs_old/**'
      - '.github/workflows/wiki-sync.yml'

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # allows GITHUB_TOKEN to push back to the repo
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Regenerate _Sidebar.md
        run: |
          printf '## Wiki\n\n' > wiki/_Sidebar.md
          for f in wiki/*.md; do
            [[ "$(basename "$f")" == "_Sidebar.md" ]] && continue
            title=$(basename "${f%.md}")
            printf -- '- [%s](%s)\n' "$title" "$title" >> wiki/_Sidebar.md
          done

      - name: Commit wiki changes
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add wiki/
          git diff --cached --quiet && echo "No changes to commit" || \
            git commit -m "docs: auto-regenerate wiki sidebar [skip ci]" && git push origin HEAD
