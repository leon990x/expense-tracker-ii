name: Wiki Sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '.github/workflows/wiki-sync.yml'
  pull_request:
    types: [opened, synchronize, closed]
    paths: ['**/*.md']

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-wiki:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone GitHub Wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.wiki.git" \
            /tmp/wiki-repo

      - name: Copy wiki/ pages and regenerate _Sidebar.md
        run: |
          if compgen -G 'wiki/*.md' > /dev/null; then
            cp wiki/*.md /tmp/wiki-repo/
          fi
          printf '## Wiki\n\n' > /tmp/wiki-repo/_Sidebar.md
          shopt -s nullglob
          for f in /tmp/wiki-repo/*.md; do
            [[ "$(basename "$f")" == "_Sidebar.md" ]] && continue
            title=$(basename "${f%.md}")
            printf -- '- [%s](%s)\n' "$title" "$title" >> /tmp/wiki-repo/_Sidebar.md
          done

      - name: Commit and push to wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /tmp/wiki-repo
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: sync wiki from main [skip ci]"
            git push \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.wiki.git" \
              HEAD:master
          fi

  ping-copilot:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Ping Copilot on PR update
        if: github.event.action != 'closed'
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "@copilot please run the 'wiki-sync' skill on this branch. The PR contains changes to .md files. Analyze all changed .md files in this PR branch, generate organized wiki pages, and push them to the GitHub wiki repository (\`${{ github.repository }}.wiki.git\`) using \`GITHUB_TOKEN\`."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ping Copilot after PR merge
        if: github.event.action == 'closed' && github.event.pull_request.merged == true
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "@copilot please run the 'wiki-sync' skill on the \`main\` branch. This PR has been merged and it contained .md file changes. Analyze all .md files now on main, generate organized wiki pages, and push them to the GitHub wiki repository (\`${{ github.repository }}.wiki.git\`) using \`GITHUB_TOKEN\`."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
