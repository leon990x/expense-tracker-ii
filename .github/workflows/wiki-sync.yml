name: Wiki Sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '.github/workflows/wiki-sync.yml'
  pull_request:
    types: [opened, synchronize, closed]
    paths-ignore: ['wiki/**']

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  sync-wiki:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify git repository
        run: |
          pwd
          git rev-parse --is-inside-work-tree

      - name: Clone GitHub Wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.wiki.git" \
            /tmp/wiki-repo

      - name: Copy wiki/ pages and regenerate _Sidebar.md
        working-directory: ${{ github.workspace }}
        run: |
          if compgen -G 'wiki/*.md' > /dev/null; then
            cp wiki/*.md /tmp/wiki-repo/
          fi
          printf '## Wiki\n\n' > /tmp/wiki-repo/_Sidebar.md
          shopt -s nullglob
          for f in /tmp/wiki-repo/*.md; do
            [[ "$(basename "$f")" == "_Sidebar.md" ]] && continue
            title=$(basename "${f%.md}")
            printf -- '- [%s](%s)\n' "$title" "$title" >> /tmp/wiki-repo/_Sidebar.md
          done

      - name: Commit and push to wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /tmp/wiki-repo
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: sync wiki from main [skip ci]"
            git push \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.wiki.git" \
              HEAD:master
          fi

  ping-copilot:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Ask Copilot to generate wiki pages on PR opened
        if: github.event.action == 'opened'
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body "@github-copilot Please run the **wiki-sync** skill now, following the instructions in \`.github/skills/wiki-sync/SKILL.md\` exactly. Execute in this strict order: (1) detect all new or changed documentation files in this PR (\`BUSINESS-RULES.md\`, \`TECHNICAL-NOTES.md\`, \`*.doc.md\`) compared to the base branch, (2) read and analyze each changed doc file, (3) generate or update the corresponding wiki page inside \`wiki/\` using the templates defined in SKILL.md step 3 — do NOT just copy the file contents verbatim, (4) update the aggregate index files \`wiki/Business-Rules.md\` and \`wiki/Technical-Notes.md\`, (5) commit only the \`wiki/\` changes to this PR branch, (6) only after the commit is pushed, provide any code review commentary. Do not post review comments before the wiki commit is complete."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ask Copilot to refresh wiki pages on PR synchronize
        if: github.event.action == 'synchronize'
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body "@github-copilot This PR has been updated. Please rerun the **wiki-sync** skill (\`.github/skills/wiki-sync/SKILL.md\`) for the latest changes. Same strict order applies: (1) detect newly changed doc files vs. base branch, (2) analyze each one, (3) generate or update wiki pages in \`wiki/\` using the SKILL.md templates — do NOT copy verbatim, (4) regenerate aggregate index files, (5) commit only \`wiki/\` changes to this branch, (6) then provide review commentary."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger wiki-sync after PR merge
        if: github.event.action == 'closed' && github.event.pull_request.merged == true
        run: |
          gh workflow run wiki-sync.yml --repo ${{ github.repository }} --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
