name: Publish wiki
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [closed]
concurrency:
  group: publish-wiki
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  publish-wiki:
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish docs to wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          WIKI_DIR="$(mktemp -d)"
          git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/leon990x/expense-tracker-ii.wiki.git" "$WIKI_DIR"

          find "$WIKI_DIR" -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +

          to_title() {
            basename "$1" | sed -E 's/([a-z0-9])([A-Z])/\1 \2/g'
          }

          to_page() {
            echo "$1" | sed -E 's/\.md$//; s#/#-#g'
          }

          VERSION_VALUE="unknown"
          if [ -f "VERSION" ]; then
            VERSION_VALUE="$(cat VERSION)"
          fi

          for section in Dashboards Components App Data Types; do
            if [ -d "docs/$section" ]; then
              find "docs/$section" -maxdepth 1 -type f -name "*.md" | sort | while read -r file; do
                rel_path="${file#docs/}"
                page="$(to_page "$rel_path")"
                cp "$file" "$WIKI_DIR/${page}.md"
              done
            fi
          done

          {
            echo "# Documentation"
            echo
            echo "**Version:** ${VERSION_VALUE}"
            for section in Dashboards Components App Data Types; do
              if [ -d "docs/$section" ]; then
                echo
                echo "## $section"
                find "docs/$section" -maxdepth 1 -type f -name "*.md" | sort | while read -r file; do
                  rel_path="${file#docs/}"
                  page="$(to_page "$rel_path")"
                  title="$(to_title "${rel_path%.md}")"
                  echo "- [${title}](${page})"
                done
              fi
            done
          } > "$WIKI_DIR/Home.md"

          {
            echo "# Sections"
            echo "- [Home](Home)"
            for section in Dashboards Components App Data Types; do
              if [ -d "docs/$section" ]; then
                echo
                echo "## $section"
                find "docs/$section" -maxdepth 1 -type f -name "*.md" | sort | while read -r file; do
                  rel_path="${file#docs/}"
                  page="$(to_page "$rel_path")"
                  title="$(to_title "${rel_path%.md}")"
                  echo "- [${title}](${page})"
                done
              fi
            done
          } > "$WIKI_DIR/_Sidebar.md"

          cd "$WIKI_DIR"
          git rev-parse --is-inside-work-tree
          git add -A
          if git diff --cached --quiet; then
            echo "No wiki changes to publish"
            exit 0
          fi

          git commit -m "Sync docs from ${GITHUB_SHA}"
          git push origin HEAD
