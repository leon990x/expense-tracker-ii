name: Publish wiki
on:
  push:
    branches: [main]
    paths:
      - docs/**
      - .github/workflows/publish-wiki.yml
concurrency:
  group: publish-wiki
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  publish-wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish docs to wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          WIKI_DIR="$(mktemp -d)"
          git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/leon990x/expense-tracker-ii.wiki.git" "$WIKI_DIR"

          rsync -av --delete --exclude='.git/' docs/ "$WIKI_DIR/"

          to_title() {
            basename "$1" | sed -E 's/([a-z0-9])([A-Z])/\1 \2/g'
          }

          {
            echo "# Documentation"
            for section in Dashboards Components App Data Types; do
              if [ -d "$WIKI_DIR/$section" ]; then
                echo
                echo "## $section"
                find "$WIKI_DIR/$section" -maxdepth 1 -type f -name "*.md" | sort | while read -r file; do
                  rel_path="${file#$WIKI_DIR/}"
                  wiki_page="${rel_path%.md}"
                  title="$(to_title "${rel_path%.md}")"
                  echo "- [${title}](${wiki_page})"
                done
              fi
            done
          } > "$WIKI_DIR/Home.md"

          {
            echo "# Sections"
            echo "- [Home](Home)"
            for section in Dashboards Components App Data Types; do
              if [ -d "$WIKI_DIR/$section" ]; then
                echo
                echo "## $section"
                find "$WIKI_DIR/$section" -maxdepth 1 -type f -name "*.md" | sort | while read -r file; do
                  rel_path="${file#$WIKI_DIR/}"
                  wiki_page="${rel_path%.md}"
                  title="$(to_title "${rel_path%.md}")"
                  echo "- [${title}](${wiki_page})"
                done
              fi
            done
          } > "$WIKI_DIR/_Sidebar.md"

          cd "$WIKI_DIR"
          git rev-parse --is-inside-work-tree
          git add -A
          if git diff --cached --quiet; then
            echo "No wiki changes to publish"
            exit 0
          fi

          git commit -m "Sync docs from ${GITHUB_SHA}"
          git push origin HEAD
